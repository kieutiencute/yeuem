<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gửi em 💌</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family: -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    background: #ffe4ec;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    touch-action: manipulation;
  }
  #hearts {
    position:fixed; inset:0; z-index:1;
    pointer-events:none;
  }
  #app {
    position:fixed; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    max-width: 480px;
    animation: fadeUp 0.7s cubic-bezier(.2,.8,.3,1);
  }
  .screen.active { display: flex; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
  }

  /* === SCREEN 1: START === */
  .envelope {
    font-size: 130px;
    animation: float 2.5s ease-in-out infinite;
    filter: drop-shadow(0 12px 24px rgba(255,105,150,0.4));
    cursor: pointer;
    margin-bottom: 20px;
  }
  .title {
    font-size: 28px;
    font-weight: 800;
    color: #d6336c;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(255,105,150,0.3);
  }
  .subtitle {
    font-size: 15px;
    color: #a86b8a;
    margin-bottom: 40px;
    font-weight: 600;
  }
  .btn {
    padding: 16px 40px;
    border: none;
    border-radius: 40px;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    box-shadow: 0 8px 24px rgba(255,105,150,0.45), inset 0 -3px 0 rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .btn:active {
    transform: scale(0.95);
    box-shadow: 0 4px 12px rgba(255,105,150,0.4);
  }

  /* === SCREEN 2: MESSAGE === */
  .avatar-wrap {
    position: relative;
    width: 150px; height: 150px;
    margin-bottom: 30px;
    animation: float 3s ease-in-out infinite;
  }
  .avatar-wrap img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #fff;
    box-shadow: 0 10px 30px rgba(255,105,150,0.4);
    position: relative;
    z-index: 2;
  }
  .avatar-ring {
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 3px solid #ff9ebd;
    animation: pulse-ring 2s ease-out infinite;
  }
  .avatar-ring:nth-child(3) {
    animation-delay: 1s;
  }
  .message {
    min-height: 120px;
    font-size: 22px;
    font-weight: 700;
    color: #d6336c;
    line-height: 1.6;
    padding: 0 10px;
    margin-bottom: 24px;
    text-shadow: 0 2px 8px rgba(255,105,150,0.15);
  }
  .caret {
    display: inline-block;
    width: 2px;
    background: #d6336c;
    animation: blink 0.8s steps(2) infinite;
    margin-left: 2px;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .btn-hidden {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .btn-hidden.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* === SCREEN 3: QUESTION === */
  .pair {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 30px;
  }
  .pair img {
    width: 90px; height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff;
    box-shadow: 0 8px 20px rgba(255,105,150,0.35);
  }
  .pair .heart-mid {
    font-size: 34px;
    animation: heartbeat 1.3s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(255,50,100,0.4));
  }
  .question {
    font-size: 26px;
    font-weight: 800;
    color: #d6336c;
    margin-bottom: 40px;
    line-height: 1.5;
    padding: 0 10px;
  }
  .btn-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    width: 100%;
    min-height: 90px;
  }
  .btn-yes {
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    padding: 16px 30px;
  }
  .btn-no {
    background: linear-gradient(135deg, #b0b0c0, #9090a8);
    padding: 16px 30px;
    transition: all 0.3s cubic-bezier(.6,-0.28,.735,.045);
    position: relative;
    z-index: 5;
  }

  /* === SCREEN 4: CELEBRATE === */
  .celebrate-emoji {
    font-size: 60px;
    margin-bottom: 20px;
    animation: wiggle 1s ease-in-out infinite;
  }
  .celebrate-title {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff3d7f, #ff8fab, #ffc7d9);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
    text-shadow: 0 4px 20px rgba(255,105,150,0.3);
  }
  .hug {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: -20px;
    margin: 30px 0;
  }
  .hug img {
    width: 120px; height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #fff;
    box-shadow: 0 10px 30px rgba(255,105,150,0.5);
    animation: float 3s ease-in-out infinite;
  }
  .hug img:first-child {
    margin-right: -25px;
    z-index: 2;
    animation-delay: 0.3s;
  }
  .hug img:last-child {
    margin-left: -25px;
    z-index: 1;
  }
  .final-text {
    font-size: 17px;
    color: #a86b8a;
    font-weight: 700;
    line-height: 1.6;
    padding: 0 20px;
  }

  /* Confetti particles */
  .confetti-piece {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    font-size: 24px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    from {
      transform: translateY(-50px) rotate(0deg);
      opacity: 1;
    }
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0.8;
    }
  }

  /* Responsive */
  @media (max-width: 400px) {
    .envelope { font-size: 100px; }
    .title { font-size: 24px; }
    .message { font-size: 19px; }
    .question { font-size: 22px; }
    .avatar-wrap { width: 130px; height: 130px; }
    .pair img { width: 75px; height: 75px; }
    .hug img { width: 100px; height: 100px; }
    .celebrate-title { font-size: 26px; }
    .btn { padding: 14px 30px; font-size: 16px; }
  }
</style>
</head>
<body>

<canvas id="hearts"></canvas>

<main id="app">

  <!-- ============ SCREEN 1 ============ -->
  <section id="s1" class="screen active">
    <div class="envelope" id="envelope">💌</div>
    <h1 class="title">Em có thư nè...</h1>
    <p class="subtitle">Chạm để mở nhé 🥺</p>
    <button class="btn" id="openBtn">Mở thư 💖</button>
  </section>

  <!-- ============ SCREEN 2 ============ -->
  <section id="s2" class="screen">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-ring"></div>
      <img id="herAvatar" alt="em">
    </div>
    <div class="message" id="message"></div>
    <button class="btn btn-hidden" id="nextBtn">Tiếp tục →</button>
  </section>

  <!-- ============ SCREEN 3 ============ -->
  <section id="s3" class="screen">
    <div class="pair">
      <img id="meAvatar3" alt="anh">
      <span class="heart-mid">💗</span>
      <img id="herAvatar3" alt="em">
    </div>
    <h2 class="question">Em tha lỗi cho anh nhé?<br>🥺👉👈</h2>
    <div class="btn-group">
      <button class="btn btn-yes" id="yesBtn">Em đồng ý 💖</button>
      <button class="btn btn-no"  id="noBtn">Không đâu 😤</button>
    </div>
  </section>

  <!-- ============ SCREEN 4 ============ -->
  <section id="s4" class="screen">
    <div class="celebrate-emoji">🥰</div>
    <h1 class="celebrate-title">Anh yêu em nhiều lắm!</h1>
    <div class="hug">
      <img id="meAvatar4" alt="anh">
      <img id="herAvatar4" alt="em">
    </div>
    <p class="final-text">
      Cảm ơn em đã tha lỗi cho anh 💗<br>
      Anh hứa sẽ cưng chiều em thật nhiều!<br>
      <span style="font-size: 24px;">🌸 ❤️ 🌸</span>
    </p>
  </section>

</main>

<script>
(function(){
'use strict';

// ============================================================
//  🖼️ AVATAR URLS
// ============================================================
const HER_IMG = 'https://cdn.phototourl.com/member/2026-10-15-067be7a6-48b7-4e8a-a792-f35d61f69c94.jpg';
const ME_IMG  = 'https://cdn.phototourl.com/member/2026-10-15-3f40dbc1-66ce-4636-a5b6-d7defc3867ce.jpg';

// Set ảnh + fallback emoji nếu load lỗi
function setImg(el, url, fallback){
  el.onerror = () => {
    const p = el.parentNode;
    const div = document.createElement('div');
    div.style.cssText = el.style.cssText + ';display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffd1dc,#ffe4e1);font-size:60px;';
    div.textContent = fallback;
    p.replaceChild(div, el);
  };
  el.src = url;
}
setImg(document.getElementById('herAvatar'), HER_IMG, '🌸');
setImg(document.getElementById('herAvatar3'), HER_IMG, '🌸');
setImg(document.getElementById('herAvatar4'), HER_IMG, '🌸');
setImg(document.getElementById('meAvatar3'), ME_IMG, '🐻');
setImg(document.getElementById('meAvatar4'), ME_IMG, '🐻');

// ============================================================
//  🔊 CUTE SOUND ENGINE (Web Audio)
// ============================================================
const Sound = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  musicTimer: null, step: 0, started: false,

  init(){
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.6;
      this.master.connect(this.ctx.destination);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.9;
      this.sfxGain.connect(this.master);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.18;
      this.musicGain.connect(this.master);
    } catch(e){}
  },

  resume(){
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  // Soft sine note
  note(freq, dur, vol, type, gainNode){
    if (!this.ctx) return;
    const T = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const a = 0.008;
    g.gain.setValueAtTime(0.0001, T);
    g.gain.linearRampToValueAtTime(vol, T + a);
    g.gain.exponentialRampToValueAtTime(0.0001, T + dur);
    o.connect(g);
    g.connect(gainNode || this.sfxGain);
    o.start(T);
    o.stop(T + dur + 0.05);
  },

  // Cute bell chime (2-note)
  chime(){
    this.note(880, 0.25, 0.15, 'sine');
    setTimeout(() => this.note(1318.5, 0.35, 0.12, 'sine'), 60);
  },

  // Soft tap/pop
  tap(){
    this.note(700, 0.06, 0.12, 'triangle');
  },

  // Text tick
  tick(){
    this.note(1600 + Math.random() * 200, 0.04, 0.05, 'triangle');
  },

  // Whoosh for dodging button
  whoosh(){
    if (!this.ctx) return;
    const T = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(800, T);
    o.frequency.exponentialRampToValueAtTime(200, T + 0.2);
    g.gain.setValueAtTime(0.12, T);
    g.gain.exponentialRampToValueAtTime(0.0001, T + 0.22);
    o.connect(g); g.connect(this.sfxGain);
    o.start(T); o.stop(T + 0.25);
  },

  // Victory fanfare
  victory(){
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach((f, i) => {
      setTimeout(() => {
        this.note(f, 0.4, 0.22, 'triangle');
        this.note(f * 2, 0.3, 0.08, 'sine');
      }, i * 120);
    });
  },

  // Romantic piano loop
  startMusic(){
    if (!this.ctx || this.musicTimer) return;
    // Melody in C major, romantic feel
    const melody = [
      // Cute romantic phrase
      659.25, 783.99, 880.00, 783.99,
      659.25, 587.33, 523.25, 587.33,
      659.25, 880.00, 1046.5, 880.00,
      783.99, 659.25, 587.33, 523.25
    ];
    const bass = [
      261.63, 261.63, 293.66, 293.66,
      329.63, 329.63, 349.23, 349.23,
      261.63, 261.63, 293.66, 293.66,
      329.63, 349.23, 392.00, 392.00
    ];

    const self = this;
    let step = 0;
    this.musicTimer = setInterval(() => {
      if (!self.ctx) { step++; return; }
      const m = melody[step % melody.length];
      self.note(m, 0.55, 0.10, 'triangle', self.musicGain);
      if (step % 2 === 0) {
        const b = bass[Math.floor(step / 2) % bass.length];
        self.note(b, 0.9, 0.13, 'sine', self.musicGain);
      }
      step++;
    }, 420);
  }
};

// ============================================================
//  💗 FLOATING HEARTS BACKGROUND
// ============================================================
const heartCanvas = document.getElementById('hearts');
const hctx = heartCanvas.getContext('2d');
let HW = 0, HH = 0, HDPR = 1;
const heartParticles = [];

function resizeHearts(){
  HDPR = Math.min(window.devicePixelRatio || 1, 2);
  HW = window.innerWidth; HH = window.innerHeight;
  heartCanvas.width = Math.floor(HW * HDPR);
  heartCanvas.height = Math.floor(HH * HDPR);
  heartCanvas.style.width = HW + 'px';
  heartCanvas.style.height = HH + 'px';
  hctx.setTransform(HDPR, 0, 0, HDPR, 0, 0);
}
window.addEventListener('resize', resizeHearts);
window.addEventListener('orientationchange', () => setTimeout(resizeHearts, 200));

const HEART_COLORS = ['#ff6b9d', '#ff8fab', '#ffb3c6', '#ffc7d9', '#e8a2c8', '#ff9ebd'];
const HEART_EMOJIS = ['💖', '💗', '💕', '🌸', '✨', '💝'];

function spawnHeartParticle(){
  heartParticles.push({
    x: Math.random() * HW,
    y: HH + 30,
    vx: (Math.random() - 0.5) * 20,
    vy: -25 - Math.random() * 40,
    size: 12 + Math.random() * 18,
    rot: (Math.random() - 0.5) * 0.8,
    rotSpeed: (Math.random() - 0.5) * 0.02,
    life: 1, maxLife: 1,
    type: Math.random() < 0.4 ? 'emoji' : 'shape',
    color: HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)],
    emoji: HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)]
  });
}

function drawHeartShape(c, x, y, size, color){
  c.save();
  c.translate(x, y);
  c.fillStyle = color;
  c.beginPath();
  const s = size / 20;
  c.moveTo(0, s * 4);
  c.bezierCurveTo(s * 8, -s * 4, s * 16, s * 2, 0, s * 12);
  c.bezierCurveTo(-s * 16, s * 2, -s * 8, -s * 4, 0, s * 4);
  c.fill();
  c.restore();
}

function updateHearts(dt){
  hctx.clearRect(0, 0, HW, HH);

  // Spawn
  if (Math.random() < 0.4){
    spawnHeartParticle();
  }

  for (let i = heartParticles.length - 1; i >= 0; i--){
    const p = heartParticles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy -= 3 * dt; // nhẹ nhàng bay lên
    p.rot += p.rotSpeed;
    p.life -= dt * 0.15;
    if (p.life <= 0 || p.y < -50){
      heartParticles.splice(i, 1);
      continue;
    }
    const alpha = p.life / p.maxLife * 0.75;
    hctx.save();
    hctx.globalAlpha = alpha;
    hctx.translate(p.x, p.y);
    hctx.rotate(p.rot);

    if (p.type === 'emoji'){
      hctx.font = p.size + 'px "Apple Color Emoji", serif';
      hctx.textAlign = 'center';
      hctx.textBaseline = 'middle';
      hctx.fillText(p.emoji, 0, 0);
    } else {
      drawHeartShape(hctx, 0, 0, p.size, p.color);
    }
    hctx.restore();
  }
}

// ============================================================
//  🎬 SCREEN MANAGEMENT
// ============================================================
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============================================================
//  ✍️ TYPEWRITER + MESSAGES
// ============================================================
const MESSAGES = [
  'Em yêu à... 🌸',
  'Anh biết mình đã sai rồi 🥺',
  'Anh xin lỗi vì đã khiến em phải buồn...',
  'Em là điều tuyệt vời nhất mà anh có 💗',
  'Anh hứa sẽ không để em phải khóc nữa',
  'Tha lỗi cho anh nhé? 🥺👉👈'
];

let msgIndex = 0;
let typing = false;
let typingTimer = null;

function typeMessage(text, onDone){
  const el = document.getElementById('message');
  el.innerHTML = '';
  typing = true;
  let i = 0;

  // Caret
  const caret = document.createElement('span');
  caret.className = 'caret';
  caret.style.height = '22px';

  function step(){
    if (i >= text.length){
      typing = false;
      if (onDone) onDone();
      return;
    }
    const ch = text[i];
    el.textContent = text.slice(0, i + 1);
    el.appendChild(caret);
    // Sound per char (không phát nhiều quá)
    if (i % 3 === 0 && ch !== ' ') Sound.tick();
    i++;
    typingTimer = setTimeout(step, 55 + Math.random() * 40);
  }
  step();
}

function nextMessage(){
  if (typing) return;
  if (msgIndex >= MESSAGES.length){
    // Xong hết → sang câu hỏi
    setTimeout(() => {
      showScreen('s3');
      Sound.chime();
    }, 400);
    return;
  }
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.remove('show');
  typeMessage(MESSAGES[msgIndex], () => {
    msgIndex++;
    if (msgIndex < MESSAGES.length){
      nextBtn.classList.add('show');
      nextBtn.textContent = 'Tiếp →';
    } else {
      nextBtn.classList.add('show');
      nextBtn.textContent = 'Em đọc xong rồi 💗';
    }
  });
}

// ============================================================
//  🎮 INTERACTIONS
// ============================================================
document.getElementById('openBtn').addEventListener('click', () => {
  Sound.resume();
  Sound.chime();
  Sound.startMusic();
  showScreen('s2');
  setTimeout(() => nextMessage(), 500);
});

document.getElementById('envelope').addEventListener('click', () => {
  document.getElementById('openBtn').click();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  Sound.tap();
  nextMessage();
});

// ============================================================
//  🥺 NÚT "KHÔNG" CHẠY TRỐN
// ============================================================
const noBtn = document.getElementById('noBtn');
let noCount = 0;
let noBusy = false;

const NO_TEXTS = [
  'Không đâu 😤',
  'Ơ kìa 🥺',
  'Đừng mà~ 🥹',
  'Cho anh xin lỗi mà 💗',
  'Tha cho anh đi 🥺',
  'Anh biết lỗi rồi mà 😭',
  'Em ơiii 🥺👉👈',
  'Năn nỉ đó~ 💗'
];

function dodgeNo(){
  if (noBusy) return;
  noBusy = true;
  noCount++;
  Sound.whoosh();
  if (navigator.vibrate) navigator.vibrate(20);

  // Di chuyển nút ngẫu nhiên quanh vùng button group
  const group = noBtn.parentNode;
  const groupRect = group.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const maxDx = Math.min(120, groupRect.width * 0.4);
  const maxDy = 60;

  let dx = (Math.random() - 0.5) * 2 * maxDx;
  let dy = (Math.random() - 0.5) * 2 * maxDy;

  // Đảm bảo không bay quá xa
  dx = Math.max(-maxDx, Math.min(maxDx, dx));
  dy = Math.max(-maxDy, Math.min(maxDy, dy));

  noBtn.style.transform = `translate(${dx}px, ${dy}px) rotate(${(Math.random()-0.5)*20}deg)`;

  // Đổi chữ
  if (noCount < NO_TEXTS.length){
    noBtn.textContent = NO_TEXTS[noCount];
  } else {
    noBtn.textContent = 'Không đâu 😤';
  }

  // Nhỏ dần
  const scale = Math.max(0.5, 1 - noCount * 0.08);
  noBtn.style.opacity = scale;

  // Sau 5-6 lần thì biến mất
  if (noCount >= 6){
    noBtn.style.transition = 'all 0.5s ease-out';
    noBtn.style.transform = `translate(${dx}px, ${dy - 200}px) rotate(720deg) scale(0.1)`;
    noBtn.style.opacity = '0';
    setTimeout(() => {
      noBtn.style.pointerEvents = 'none';
    }, 500);
  }

  setTimeout(() => { noBusy = false; }, 200);
}

noBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  dodgeNo();
}, { passive: false });
noBtn.addEventListener('mouseenter', dodgeNo);
noBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if (noCount >= 6) return;
  dodgeNo();
});

// ============================================================
//  🎉 "CÓ" → CELEBRATION
// ============================================================
document.getElementById('yesBtn').addEventListener('click', () => {
  Sound.victory();
  if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);
  showScreen('s4');
  setTimeout(() => launchConfetti(), 300);
});

// ============================================================
//  🎊 CONFETTI
// ============================================================
const CONFETTI_EMOJI = ['💖','💗','💕','🌸','✨','💝','🎉','🥰','💞','🌷'];

function launchConfetti(){
  for (let i = 0; i < 60; i++){
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (18 + Math.random() * 20) + 'px';
      el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      el.style.animationDelay = '0s';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }, i * 40);
  }
  // Lặp lại 2 lần nữa
  setTimeout(() => {
    for (let i = 0; i < 40; i++){
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (20 + Math.random() * 24) + 'px';
        el.style.animationDuration = (3 + Math.random() * 2) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6000);
      }, i * 50);
    }
  }, 1500);
}

// ============================================================
//  🔁 MAIN LOOP
// ============================================================
let lastT = 0;
function loop(t){
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.1) dt = 0.1;
  updateHearts(dt);
  requestAnimationFrame(loop);
}

// ============================================================
//  🚀 BOOT
// ============================================================
resizeHearts();

// Pre-spawn vài tim cho nền đẹp sẵn
for (let i = 0; i < 15; i++){
  heartParticles.push({
    x: Math.random() * HW,
    y: Math.random() * HH,
    vx: (Math.random() - 0.5) * 15,
    vy: -15 - Math.random() * 25,
    size: 10 + Math.random() * 18,
    rot: (Math.random() - 0.5) * 0.8,
    rotSpeed: (Math.random() - 0.5) * 0.02,
    life: 0.6 + Math.random() * 0.4,
    maxLife: 1,
    type: Math.random() < 0.4 ? 'emoji' : 'shape',
    color: HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)],
    emoji: HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)]
  });
}

requestAnimationFrame(loop);

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

})();
</script>
